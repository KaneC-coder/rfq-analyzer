<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFQ智能报价助手</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>RFQ智能报价助手</h1>
            <p class="subtitle">上传RFQ截图，自动生成报价分析报告</p>
        </header>

        <div class="usage-info" id="usageInfo">
            <span class="usage-label">剩余免费次数：</span>
            <span class="usage-count" id="freeCount">3</span>
        </div>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept="image/*" hidden>
                <div class="upload-icon">📤</div>
                <p class="upload-text">点击或拖拽上传RFQ截图</p>
                <p class="upload-hint">支持 JPG、PNG、WEBP 格式，最大16MB</p>
            </div>
            <button class="btn-primary" id="analyzeBtn" disabled>开始分析</button>
        </div>

        <div class="preview-section" id="previewSection" style="display: none;">
            <h2>图片预览</h2>
            <div class="image-preview" id="imagePreview"></div>
        </div>

        <div class="progress-section" id="progressSection" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText">正在分析...</p>
        </div>

        <div class="result-section" id="resultSection" style="display: none;">
            <h2>分析结果</h2>
            <div class="result-card" id="resultCard"></div>
            <button class="btn-primary" id="downloadBtn">下载报告</button>
        </div>

        <div class="error-section" id="errorSection" style="display: none;">
            <p class="error-text" id="errorText"></p>
            <button class="btn-secondary" onclick="location.reload()">重试</button>
        </div>

        <div class="payment-section" id="paymentSection" style="display: none;">
            <h2>免费次数已用完</h2>
            <p>每次分析仅需 <span class="price">0.5元</span></p>
            <button class="btn-primary" id="payBtn">继续支付</button>
            <p class="payment-hint">支持微信/支付宝支付</p>
        </div>

        <footer>
            <p>© 2026 RFQ智能报价助手 | 让外贸报价更高效</p>
        </footer>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
